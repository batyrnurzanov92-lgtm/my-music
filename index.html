<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#131317">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Моя музыка">
  <title>Моя музыка</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The current screen (songs / playlists / add) is drawn here by app.js -->
  <main id="view" tabindex="-1"></main>

  <!-- Mini player above the tab bar -->
  <div id="mini" hidden>
    <div class="mini-progress"><div id="mini-bar"></div></div>
    <button class="mini-open" id="mini-open" aria-label="Открыть плеер">
      <div id="mini-cover"></div>
      <div class="meta"><div class="t1" id="mini-title"></div><div class="t2" id="mini-artist"></div></div>
    </button>
    <button class="icon-btn big" id="mini-play" aria-label="Играть"></button>
    <button class="icon-btn" id="mini-next" aria-label="Следующая песня"></button>
  </div>

  <!-- Bottom tabs -->
  <nav class="tabbar" aria-label="Разделы">
    <button data-tab="songs"><span class="ic-slot" data-icon="note"></span>Песни</button>
    <button data-tab="playlists"><span class="ic-slot" data-icon="playlist"></span>Плейлисты</button>
    <button data-tab="add"><span class="ic-slot" data-icon="add"></span>Добавить</button>
  </nav>

  <!-- Full-screen "Now playing" -->
  <section id="full" aria-label="Сейчас играет" aria-hidden="true">
    <div class="full-inner">
      <button class="icon-btn" id="full-close" aria-label="Свернуть плеер"></button>
      <div id="full-cover"></div>
      <div class="full-meta">
        <div class="full-text">
          <div class="t1" id="full-title"></div>
          <div class="t2" id="full-artist"></div>
        </div>
        <button class="icon-btn" id="full-more" aria-label="Действия с песней"></button>
      </div>
      <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Позиция в песне">
      <div class="times"><span id="t-cur">0:00</span><span id="t-dur">0:00</span></div>
      <div class="controls">
        <button class="icon-btn" id="full-shuffle" aria-label="Перемешивание"></button>
        <button class="icon-btn big" id="full-prev" aria-label="Предыдущая песня"></button>
        <button class="play-btn" id="full-play" aria-label="Играть"></button>
        <button class="icon-btn big" id="full-next" aria-label="Следующая песня"></button>
        <button class="icon-btn" id="full-repeat" aria-label="Повтор"></button>
      </div>
      <div class="volume" id="volume-row">
        <span class="ic-slot" data-icon="volume"></span>
        <input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Громкость">
      </div>
    </div>
  </section>

  <div id="busy" hidden><div class="busy-box"><div class="spinner"></div><div id="busy-text"></div></div></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="drop" hidden>Отпустите файлы, чтобы добавить</div>

  <script src="js/db.js"></script>
  <script src="js/tags.js"></script>
  <script src="js/importers.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
